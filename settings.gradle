pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Poolakey (Cafe Bazaar billing) is published on JitPack only.
        maven {
            url 'https://jitpack.io'
            content { includeGroupByRegex 'com\\.github\\.cafebazaar.*' }
        }
    }
}

rootProject.name = 'TactShoot'
include 'core', 'android', 'desktop'
