name: Build Mindustry Debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and server jar
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug server:dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-debug-APK
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-server
          path: server/build/libs/server-release.jar