name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project
        run: |
          set -e
          if [ -f ./gradlew ] && [ -f ./settings.gradle ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          elif [ -d ./TactShoot-master ] && [ -f ./TactShoot-master/gradlew ]; then
            echo "PROJECT_DIR=$PWD/TactShoot-master" >> "$GITHUB_ENV"
          else
            echo "Gradle project not found"; ls -la; exit 1
          fi

      # Optional signing: add these 5 repository secrets to get a signed APK
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
          else
            echo "No keystore secrets: signing with a temporary test key (installable, NOT for store upload)"
            keytool -genkeypair -v -keystore release.keystore -alias test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass123 -keypass testpass123 \
              -dname "CN=TactShoot Test, O=Test, C=IR"
            {
              echo "storeFile=release.keystore"
              echo "storePassword=testpass123"
              echo "keyAlias=test"
              echo "keyPassword=testpass123"
            } > keystore.properties
          fi

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :android:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-release-apk
          path: ${{ env.PROJECT_DIR }}/android/build/outputs/apk/release/*.apk
          if-no-files-found: error
