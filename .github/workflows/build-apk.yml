name: Build TactShoot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK and install packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and server
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew android:assembleDebug server:dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-APK
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-Server
          path: server/build/libs/*.jar