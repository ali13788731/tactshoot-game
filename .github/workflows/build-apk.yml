name: Build Mindustry Debug APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and server jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon android:assembleDebug server:dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-debug-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-server
          path: server/build/libs/server-release.jar
          if-no-files-found: error
