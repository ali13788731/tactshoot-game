name: Build TactShoot APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or extract project
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ] && [ -f ./settings.gradle ]; then
            echo "Project found in repository root"
          elif [ -d ./TactShoot-master ] && [ -f ./TactShoot-master/gradlew ]; then
            cd TactShoot-master
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          elif [ -f ./TactShoot-bazaar.zip ]; then
            unzip -q TactShoot-bazaar.zip
            if [ -d TactShoot-master ]; then
              echo "PROJECT_DIR=$PWD/TactShoot-master" >> "$GITHUB_ENV"
            fi
          else
            echo "Could not locate TactShoot Gradle project or ZIP."
            ls -la
            exit 1
          fi
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :android:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-release-apk
          path: ${{ env.PROJECT_DIR }}/android/build/outputs/apk/release/*.apk
          if-no-files-found: error
