name: Build TactShoot APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and server
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon android:assembleDebug server:dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-APK
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: TactShoot-Server
          path: server/build/libs/*.jar
          if-no-files-found: error
